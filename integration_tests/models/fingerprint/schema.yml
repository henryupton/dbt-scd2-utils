version: 2

models:
  - name: fp_dim_scd2
    description: SCD type 2 fixture. Merge on incremental runs, truncate + insert on full refresh.
  - name: fp_dim_scd1
    description: SCD type 1 fixture. In-place overwrite of a changed key moves rows below the watermark.
  - name: fp_evt_merge
    description: dbt incremental merge on an event id. Unguarded update rewrites matched rows with equal values.
  - name: fp_stg_append
    description: dbt incremental append above a watermark with full_refresh false, the protected staging shape.
  - name: fp_table_replace
    description: dbt table. create or replace on every build, so always new.
  - name: fp_child_guarded
    description: Child of fp_dim_scd2 built by the test-only guarded_table materialization, which skips when the parent verdict allows.
  - name: fp_fct_overwrite
    description: Test-only insert-overwrite fact, the shape the project's truncate_insert uses.
  - name: fp_child_of_overwrite
    description: Guarded child of fp_fct_overwrite.
  - name: fp_evt_evolve
    description: Incremental merge with on_schema_change append_new_columns; a new column arrives by ALTER, not replace.
  - name: fp_child_of_evolve
    description: Guarded child of fp_evt_evolve.
  - name: fp_evt_sync
    description: Incremental merge with on_schema_change sync_all_columns; dropped columns leave by ALTER.
  - name: fp_child_of_sync
    description: Guarded child of fp_evt_sync.
  - name: fp_parent_no_loaded_at
    description: Merge-built table without a loaded-at column; must read unhashable.
  - name: fp_child_of_unhashable
    description: Guarded child of an unhashable parent; must always build.
  - name: fp_child_of_view
    description: Guarded child of a view; must always build.
  - name: fp_child_of_seed
    description: Guarded child of a seed; must build whether the seed is selected (new) or not (unregistered).
  - name: fp_child_of_no_tt
    description: Guarded child of a table with no Time Travel; parent reads error, child must build.
  - name: fp_child_late
    description: Enabled mid-sequence and aliased per run so no table exists yet; must build regardless of parent verdicts.
  - name: fp_dim_versioned
    description: Versioned SCD type 2 dim, the warehouse shape. Built as fp_dim_versioned_v1; the child refs the unversioned name.
    latest_version: 1
    versions:
      - v: 1
  - name: fp_child_of_versioned
    description: Guarded child of the versioned dim, ref'd by its unversioned name; skips when the dim is unchanged, builds when it is modified.
  - name: fp_stg_batch
    description: Staging merge with a batch-stamped _loaded_at. Empty at first, then batches; a late chunk of the current batch lands exactly at the watermark and must read modified.
  - name: fp_child_of_batch
    description: Guarded child of fp_stg_batch.
  - name: fp_child_of_registry
    description: Guarded child of a registry seed with no loaded-at column; the parent reads unhashable whatever its content, so this always builds.
  - name: fp_child_of_seed_live
    description: Guarded child of a seed whose content the runner rewrites mid-sequence; skips on an identical reload, builds on a changed one.
